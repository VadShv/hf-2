  (function() {

      const isLightSidebar = () => {
        const sidebarColor = getComputedStyle(document.body).getPropertyValue('--sidebar-background');
        const c = sidebarColor.substring(1); // Убираем #
        const rgb = parseInt(c, 16); // rrggbb -> decimal
        const r = (rgb >> 16) & 0xff; // R
        const g = (rgb >> 8) & 0xff; // G
        const b = (rgb >> 0) & 0xff; // B
        // HSP (Highly Sensitive Poo): http://alienryderflex.com/hsp.html
        const hsp = Math.sqrt(0.299 * (r * r) + 0.587 * (g * g) + 0.114 * (b * b));
        return hsp < 127.5
      }
      const skeletonWrapper = document.querySelector('.skeleton-wrapper')
      const sidebarPlaceholder = document.querySelector('.layout-placeholder');
      const memberType = window.UserPermissions.member_type;
      if (memberType === 'watcher') {
        skeletonWrapper.classList.add('is-watcher')
      }

      // account-events.js may fail to load; a throw here would
      // skip handleUrlChange() below and leave every skeleton hidden
      const accountEventItems = (window.AccountEvents && window.AccountEvents.items) || [];
      const dashboardEvents = accountEventItems.find((item) => {
        return item.type === 'dashboard-events';
      });
      if ((!dashboardEvents || dashboardEvents.value)) {
        skeletonWrapper.classList.add('dashboard-event-list-visible');
      }

      if (isLightSidebar()) {
        sidebarPlaceholder.classList.add('dark-skeleton')
      }

      const pathUrlsForSkeleton = ['/app/my/gk51295', '/app/my/gk51295/', '/app/my/gk51295/applicants'];
      const pathUrlsWithoutSidebar = ['/app/settings', '/app/my/gk51295/reports'];
      const handleUrlChange = () => {
        const skeletonShown = pathUrlsForSkeleton.includes(window.location.pathname);
        skeletonWrapper.classList[skeletonShown ? 'add' : 'remove']('shown');

        const sidebarHidden = pathUrlsWithoutSidebar.some((path) => window.location.pathname.startsWith(path));
        sidebarPlaceholder.classList[sidebarHidden ? 'remove' : 'add']('layout-placeholder_with-sidebar')
      }
      // popstate ловит только back/forward; pushState/replaceState (навигация
      // vue-router и редиректы) его не вызывают, поэтому патчим History API
      const patchHistory = (type) => {
        const original = history[type];
        history[type] = function () {
          const result = original.apply(this, arguments);
          handleUrlChange();
          return result;
        };
      };
      patchHistory('pushState');
      patchHistory('replaceState');
      window.addEventListener('popstate', handleUrlChange)
      handleUrlChange()
    } catch (e) {}
  })()
